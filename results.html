<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FT RESULTS | ARROWZ栃木ポータルサイト</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>

    <div id="common-header"></div>

    <main>
        <!-- Section 1: This Month's Results -->
        <section class="section">
            <div class="container">
                <h2 class="section-title" data-text="今月の結果">今月の結果</h2>
                <div class="result-summary-card">
                    <div class="summary-header">
                        <span class="summary-label">COMMENT</span>
                    </div>
                    <div class="summary-body">
                        <p class="summary-comment" id="res-comment"
                            style="font-size: 1.2rem; line-height: 1.6; margin-bottom: 1rem;">
                            今月の要約コメント
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section 2: Ranking Table -->
        <section class="section">
            <div class="container">
                <div class="section-heading-row">
                    <h2 class="section-title" data-text="総合ランキング">総合ランキング<span
                            class="ranking-title-badge">TOP10</span></h2>
                    <a href="ranking.html" class="btn-primary ranking-heading-btn">種目別ランキング <span
                            class="arrow">&rarr;</span></a>
                </div>
                <div class="ranking-wrapper">
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th>RANK</th>
                                <th>NAME</th>
                                <th>CLASS</th>
                                <th>平均種目順位</th>
                            </tr>
                        </thead>
                        <tbody id="res-ranking-body"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="common-footer"></div>

    <script src="js/layout.js"></script>
    <script src="js/ranking_data.js"></script>
    <script src="js/overall_ranking.js"></script>
    <script src="js/results_data.js"></script>
    <script src="js/main.js"></script>
    <script>
        (function () {
            // Apply Results Data dynamically
            if (window.RESULTS_DATA) {
                const resData = window.RESULTS_DATA;

                const commentEl = document.getElementById('res-comment');
                if (commentEl && resData.comment) {
                    commentEl.textContent = resData.comment;
                }

            }

            if (!window.RANKING_DATA) return;

            const sorted = window.OverallRanking.calculate(window.RANKING_DATA);

            const tbody = document.getElementById('res-ranking-body');
            if (tbody) {
                sorted.slice(0, 10).forEach((entry, i) => {
                    const d = entry.item;
                    const tr = document.createElement('tr');
                    if (i < 3) tr.className = 'rank-' + (i + 1);
                    tr.innerHTML = `<td class="rank-num">${String(i + 1).padStart(2, '0')}</td><td class="rank-name">${d.name}</td><td>${d.class || d.category || ''}</td><td class="rank-score">${entry.averageRank.toFixed(2)}</td>`;
                    tbody.appendChild(tr);
                });
            }
        })();
    </script>
</body>

</html>
